<!doctype html>
<html><head><base target="_top"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
  :root{--red:#e51b27;--ink:#251a18;--paper:#fff8f1}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,#fffaf4,#ffe6df);color:var(--ink);font-family:Arial,sans-serif}.confetti{position:fixed;width:9px;height:14px;background:var(--red);animation:fall 2.5s ease-in infinite;opacity:.8}.confetti:nth-child(2n){background:#ffb8a9;left:18%!important;animation-delay:.3s}.confetti:nth-child(3n){background:#fff;left:76%!important;animation-delay:.7s}@keyframes fall{from{transform:translateY(-12vh) rotate(0)}to{transform:translateY(110vh) rotate(540deg)}}main{width:min(92vw,480px);padding:28px 20px 35px;text-align:center;position:relative}.brand{color:var(--red);font-weight:800;letter-spacing:1.8px;font-size:12px}.box-scene{height:288px;margin:18px auto 22px;perspective:950px;position:relative;width:300px;max-width:100%}.box{position:absolute;inset:65px 10px 0;transform-style:preserve-3d}.lid{position:absolute;top:-50px;left:0;width:100%;height:88px;border-radius:15px 15px 5px 5px;background:linear-gradient(145deg,#fa3b45,var(--red));box-shadow:inset 0 -10px 0 #bb111d;transform-origin:50% 100%;transition:transform 1.05s cubic-bezier(.2,.82,.2,1);z-index:3}.lid:after{content:"LOVELY’S  •  BAKER ST.";color:#fff;display:grid;place-items:center;height:70px;font-size:13px;font-weight:800;letter-spacing:1.2px}.base{position:absolute;inset:30px 0 0;background:#c91723;border:9px solid #a70e18;border-radius:7px 7px 16px 16px;box-shadow:0 22px 27px #7020183b}.card{position:absolute;z-index:2;left:16px;right:16px;bottom:15px;min-height:160px;padding:20px 14px;background:var(--paper);border:1px solid #f4b9b4;border-radius:5px;box-shadow:0 8px 14px #5d141b36;transform:translateY(42px);opacity:0;transition:transform .85s .48s cubic-bezier(.15,.9,.25,1),opacity .35s .52s}.card h1{margin:0 0 12px;color:var(--red);font-size:19px;line-height:1.04}.card p{margin:0;font-size:13px;line-height:1.55}.tagline{margin:17px 0 0;color:var(--red);font-size:10px;font-weight:800;letter-spacing:1.25px}.open .lid{transform:rotateX(-117deg) translateY(-18px)}.open .card{transform:translateY(-32px);opacity:1}button{border:0;border-radius:4px;background:var(--red);padding:15px 22px;color:#fff;font-weight:800;letter-spacing:1px;cursor:pointer;box-shadow:0 8px 16px #bc16242e}@media(prefers-reduced-motion:reduce){.lid,.card{transition:none}.confetti{display:none}}
</style></head><body>
<i class="confetti" style="left:7%"></i><i class="confetti" style="left:32%"></i><i class="confetti" style="left:57%"></i><i class="confetti" style="left:88%"></i>
<main><p class="brand">LOVELY’S BAKER ST.</p><div class="box-scene" id="scene"><div class="box"><div class="lid"></div><div class="base"></div><article class="card"><h1>SOMETHING EXCITING<br>IS COOKING! 🍔</h1><p>Hi <?= customerName ?>,<br><br>We’ve received your franchise enquiry. Mr. Mandeep will be in touch with you shortly.</p></article></div></div><button id="open" type="button">OPEN YOUR BOX 🍔</button><p class="tagline">GOOD THINGS TAKE TIME. GREAT THINGS START HERE.</p></main><script>document.getElementById('open').addEventListener('click',function(){document.getElementById('scene').classList.add('open');this.hidden=true});</script></body></html>
